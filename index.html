<style>
  /* Critical first-paint — paper background, hide cursor flash */
  html, body { background: #F4F1EC; margin: 0; }
  #intro-curtain {
    position: fixed; inset: 0; z-index: 9000;
    background: #0A0A0A; color: #F4F1EC;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 720ms cubic-bezier(0.16, 1, 0.3, 1) 200ms,
                visibility 0s linear 920ms;
    font-family: Georgia, serif; font-weight: 300;
    letter-spacing: .42em; font-size: 14px; text-transform: uppercase;
  }
  #intro-curtain[data-done="true"] { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro-curtain span { display: inline-block; transform: translateY(0); }
</style>
</head>
<body>
<div id="intro-curtain" aria-hidden="true"><span>Monolith</span></div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  /* Lift the curtain after first React paint or 1100ms safety. */
  (function () {
    var curtain = document.getElementById('intro-curtain');
    if (!curtain) return;
    var lift = function () { curtain.setAttribute('data-done', 'true'); };
    if (window.requestIdleCallback) {
      requestIdleCallback(function () { setTimeout(lift, 350); }, { timeout: 1100 });
    } else {
      setTimeout(lift, 700);
    }
    setTimeout(lift, 1300);
  })();
</script>
</body>
